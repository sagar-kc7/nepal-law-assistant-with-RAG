<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nepal Law Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f1117;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 20px 40px;
            border-bottom: 1px solid #2a2a3a;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
        }

        header span {
            font-size: 13px;
            color: #888;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px 40px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .user .avatar { background: #3a3a5c; }
        .assistant .avatar { background: #1a4a3a; }

        .bubble {
            background: #1a1a2e;
            border: 1px solid #2a2a3a;
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 15px;
            line-height: 1.7;
            max-width: 680px;
        }

        .user .bubble { background: #1e1e3a; }

        .typing {
            display: flex;
            gap: 5px;
            padding: 14px 18px;
            background: #1a1a2e;
            border: 1px solid #2a2a3a;
            border-radius: 12px;
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: #4a9a7a;
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
        }

        .input-area {
            padding: 20px 40px;
            border-top: 1px solid #2a2a3a;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .input-box {
            display: flex;
            gap: 12px;
            align-items: center;
            background: #1a1a2e;
            border: 1px solid #2a2a3a;
            border-radius: 12px;
            padding: 12px 16px;
        }

        .input-box:focus-within {
            border-color: #4a9a7a;
        }

        input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: #e0e0e0;
            font-size: 15px;
        }

        input::placeholder { color: #555; }

        button {
            background: #4a9a7a;
            border: none;
            border-radius: 8px;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        button:hover { background: #3a8a6a; }
        button:disabled { background: #2a2a3a; cursor: not-allowed; }

        button svg {
            width: 16px;
            height: 16px;
            fill: white;
        }

        .welcome {
            text-align: center;
            padding: 60px 20px;
            color: #555;
        }

        .welcome h2 {
            font-size: 24px;
            color: #888;
            margin-bottom: 12px;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 24px;
        }

        .suggestion {
            background: #1a1a2e;
            border: 1px solid #2a2a3a;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 13px;
            color: #888;
            cursor: pointer;
            transition: all 0.2s;
        }

        .suggestion:hover {
            border-color: #4a9a7a;
            color: #4a9a7a;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #444;
            padding: 8px;
        }
    </style>
</head>
<body>

<header>
    <div style="font-size:24px">⚖️</div>
    <div>
        <h1>Nepal Law Assistant</h1>
        <span>Powered by AI · Constitution of Nepal 2015</span>
    </div>
</header>

<div class="chat-container" id="chat">
    <div class="welcome" id="welcome">
        <h2>Ask anything about Nepali law</h2>
        <p>Get plain English answers with legal citations</p>
        <div class="suggestions">
            <div class="suggestion" onclick="ask('Does Nepal allow death penalty?')">Does Nepal allow death penalty?</div>
            <div class="suggestion" onclick="ask('What are the fundamental rights in Nepal?')">What are fundamental rights?</div>
            <div class="suggestion" onclick="ask('What are the rights of women in Nepal?')">Rights of women</div>
            <div class="suggestion" onclick="ask('What is the right to freedom in Nepal?')">Right to freedom</div>
        </div>
    </div>
</div>

<div style="max-width:800px;width:100%;margin:0 auto">
    <div class="input-area">
        <div class="input-box">
            <input
                type="text"
                id="questionInput"
                placeholder="Ask a legal question..."
                onkeydown="if(event.key==='Enter') sendQuestion()"
            />
            <button onclick="sendQuestion()" id="sendBtn">
                <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
            </button>
        </div>
    </div>
    <div class="footer">Nepal Law Assistant · Data: Constitution of Nepal 2015</div>
</div>

<script>
const API_URL = "https://sagar-kc7--nepal-law-assistant-nepallawapi-ask.modal.run";

function ask(question) {
    document.getElementById('questionInput').value = question;
    sendQuestion();
}

async function sendQuestion() {
    const input = document.getElementById('questionInput');
    const question = input.value.trim();
    if (!question) return;

    // hide welcome
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();

    input.value = '';
    document.getElementById('sendBtn').disabled = true;

    const chat = document.getElementById('chat');

    // user message
    chat.innerHTML += `
        <div class="message user">
            <div class="avatar">👤</div>
            <div class="bubble">${question}</div>
        </div>`;

    // typing indicator
    chat.innerHTML += `
        <div class="message assistant" id="typing">
            <div class="avatar">⚖️</div>
            <div class="typing">
                <span></span><span></span><span></span>
            </div>
        </div>`;

    chat.scrollTop = chat.scrollHeight;

    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question })
        });
        const data = await response.json();
        const answer = data.answer || "Sorry, could not get an answer.";

        document.getElementById('typing').outerHTML = `
            <div class="message assistant">
                <div class="avatar">⚖️</div>
                <div class="bubble">${answer}</div>
            </div>`;
    } catch (e) {
        document.getElementById('typing').outerHTML = `
            <div class="message assistant">
                <div class="avatar">⚖️</div>
                <div class="bubble">Error connecting to API. Please try again.</div>
            </div>`;
    }

    chat.scrollTop = chat.scrollHeight;
    document.getElementById('sendBtn').disabled = false;
    input.focus();
}
</script>
</body>
</html>
